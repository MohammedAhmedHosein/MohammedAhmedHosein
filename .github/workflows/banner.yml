name: Generate Hero Banner

on:
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "assets/**"
      - ".github/scripts/generate_banner.py"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Rebuild dark.svg and light.svg
        run: python3 .github/scripts/generate_banner.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --staged --quiet || git commit -m "Rebuild banner [skip ci]"
          git push
